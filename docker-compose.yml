# Producción en el homelab (deploy-site.sh, modo compose). La base vive en
# abreviar-core-db (red abreviar-net); credenciales en .env del server.
# Desarrollo local con Postgres propia: docker-compose.dev.yml
services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000"
    restart: unless-stopped
    mem_limit: 256m
